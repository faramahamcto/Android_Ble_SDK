group 'com.veepoo.flutter_veepoo_sdk'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project(':flutter_veepoo_sdk').file('libs')
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    namespace 'com.veepoo.flutter_veepoo_sdk'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // VeepooSDK dependencies - included in plugin
    implementation(name: 'vpprotocol-2.3.28.15', ext: 'aar')
    implementation(name: 'vpbluetooth-1.18', ext: 'aar')
    implementation 'com.google.code.gson:gson:2.8.9'

    // JieLi OTA libraries (required by VeepooSDK for firmware updates)
    implementation(name: 'JL_Watch_V1.13.1_11214-release', ext: 'aar')
    implementation(name: 'jl_bt_ota_V1.10.0_10931-release', ext: 'aar')
    implementation(name: 'jl_rcsp_V0.7.2_527-release', ext: 'aar')
}

group 'com.veepoo.flutter_veepoo_sdk'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    namespace 'com.veepoo.flutter_veepoo_sdk'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // VeepooSDK dependencies - provided by host app
    // Host app must include these AAR files in their project
    // See README.md for installation instructions
    compileOnly 'com.google.code.gson:gson:2.8.9'

    // Note: vpprotocol and vpbluetooth AAR files must be added by the host app
    // The host app should add these in their android/app/build.gradle:
    // implementation(name: 'vpprotocol-2.3.28.15', ext: 'aar')
    // implementation(name: 'vpbluetooth-1.18', ext: 'aar')
}
